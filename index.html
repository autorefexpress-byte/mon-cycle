<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E91E8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Cycle">
<title>Mon Cycle</title>
<style>
:root{--pink:#E91E8C;--pink-dark:#C2185B;--pink-light:#FCE4EC;--green:#4CAF50;--green-light:#E8F5E9;--purple:#9C27B0;--purple-light:#F3E5F5;--blue:#2196F3;--blue-light:#E3F2FD;--bg:#F5F5F5;--card:#FFFFFF;--text:#1A1A1A;--text-sec:#757575;--border:#EEEEEE;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);overflow:hidden;}
.app{display:flex;flex-direction:column;width:100vw;height:100vh;height:100dvh;}
#auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;height:100dvh;background:var(--bg);padding:32px 24px;overflow-y:auto;}
.auth-logo{font-size:52px;margin-bottom:12px;}.auth-title{font-size:26px;font-weight:600;color:var(--text);margin-bottom:6px;}
.auth-sub{font-size:14px;color:var(--text-sec);margin-bottom:20px;text-align:center;line-height:1.5;}
.auth-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;}
.auth-mode-title{font-size:18px;font-weight:600;color:var(--text);text-align:center;}
.auth-error{background:#FFF3F3;border:1px solid #FFCDD2;color:#C62828;border-radius:12px;padding:11px 14px;font-size:13px;display:none;text-align:center;line-height:1.5;}
.auth-input{width:100%;padding:15px 16px;border:1.5px solid var(--border);border-radius:14px;font-size:16px;font-family:inherit;background:var(--card);color:var(--text);outline:none;transition:border-color 0.2s;}
.auth-input:focus{border-color:var(--pink);}
.auth-btn{width:100%;padding:15px;background:var(--pink);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;}
.auth-btn:active{background:var(--pink-dark);}
.auth-toggle{text-align:center;font-size:14px;color:var(--text-sec);cursor:pointer;}
.auth-toggle span{color:var(--pink);font-weight:600;}
.auth-forgot{text-align:center;font-size:13px;color:var(--pink);cursor:pointer;}
.auth-divider{text-align:center;font-size:12px;color:#ccc;margin:2px 0;}
.lang-row{display:flex;gap:8px;justify-content:center;margin-bottom:8px;}
.lang-btn{padding:6px 18px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--text-sec);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.lang-btn.active{border-color:var(--pink);background:var(--pink);color:#fff;}
.loading{position:fixed;inset:0;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:14px;}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--pink-light);border-top-color:var(--pink);animation:spin 0.75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--text-sec);text-align:center;padding:0 24px;line-height:1.5;}
.loading-retry{display:none;padding:12px 28px;background:var(--pink);color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.top-bar{padding:14px 18px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));flex-shrink:0;transition:background 0.3s;}
.top-bar.mode-normal{background:var(--pink);}.top-bar.mode-conception{background:var(--purple);}.top-bar.mode-grossesse{background:var(--blue);}
.top-bar-row{display:flex;align-items:center;justify-content:space-between;}
.top-bar-title{font-size:20px;font-weight:600;color:#fff;}.top-bar-email{font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px;}
.mode-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.2);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:#fff;margin-top:5px;}
.logout-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.logout-btn:active{background:rgba(255,255,255,0.35);}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 12px;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));}
.content::-webkit-scrollbar{display:none;}.tab-page{display:none;}.tab-page.active{display:block;}
.banner{border-radius:16px;padding:18px 20px;margin-bottom:12px;display:none;position:relative;overflow:hidden;}
.banner::after{content:"";position:absolute;right:-16px;top:-16px;width:90px;height:90px;background:rgba(255,255,255,0.1);border-radius:50%;}
.banner.normal{background:var(--pink);}.banner.conception{background:var(--purple);}.banner.grossesse{background:var(--blue);}
.banner-label{font-size:11px;color:rgba(255,255,255,0.8);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;}
.banner-date{font-size:22px;font-weight:600;color:#fff;}.banner-days{font-size:13px;color:rgba(255,255,255,0.85);margin-top:4px;}
.banner-sub{font-size:13px;color:rgba(255,255,255,0.85);margin-top:4px;line-height:1.5;}
.banner-dpa{font-size:12px;color:rgba(255,255,255,0.7);margin-top:6px;}
.banner-dot{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:28px;}
.baby-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid var(--blue);display:none;}
.baby-title{font-size:14px;font-weight:600;color:#1565C0;margin-bottom:6px;}.baby-text{font-size:13px;color:var(--text-sec);line-height:1.6;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-tile{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;}
.stat-num{font-size:24px;font-weight:600;line-height:1;}.stat-num.pink{color:var(--pink);}.stat-num.purple{color:var(--purple);}.stat-num.blue{color:var(--blue);}
.stat-lbl{font-size:10px;color:var(--text-sec);margin-top:5px;line-height:1.3;}
.card{background:var(--card);border-radius:16px;margin-bottom:12px;overflow:hidden;}
.card-head{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;}.card-title{font-size:14px;font-weight:600;color:var(--text);}
.cal-nav{display:flex;align-items:center;gap:4px;}
.cal-nav-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);font-family:inherit;}
.cal-nav-btn:active{background:#e0e0e0;}.cal-month{font-size:14px;font-weight:600;color:var(--text);min-width:116px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px 8px;}
.cal-hdr{font-size:10px;color:var(--text-sec);text-align:center;padding:4px 0 6px;font-weight:600;}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;cursor:pointer;color:var(--text);transition:transform 0.1s;-webkit-user-select:none;user-select:none;}
.day:active{transform:scale(0.82);}.day.empty{cursor:default;pointer-events:none;}
.day.fertile{background:var(--green-light);color:#2E7D32;}.day.fertile.mc{background:var(--purple-light);color:#6A1B9A;}
.day.ovulation{background:var(--green);color:#fff;font-weight:600;}.day.ovulation.mc{background:var(--purple);color:#fff;font-weight:600;}
.day.period{background:var(--pink);color:#fff;font-weight:600;border-radius:10px;}.day.predicted{background:var(--pink-light);color:var(--pink-dark);border-radius:10px;}
.day.preg-start{background:var(--purple);color:#fff;font-weight:600;border-radius:50%;}.day.preg-day{background:var(--blue-light);color:#1565C0;border-radius:10px;}
.day.today:not(.period):not(.predicted){outline:2.5px solid var(--pink);outline-offset:-2px;}
.day.selected:not(.period):not(.predicted):not(.ovulation):not(.fertile):not(.preg-start):not(.preg-day){background:#EEEEEE;}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:2px 14px 14px;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-sec);}.leg-dot{width:14px;height:8px;border-radius:4px;flex-shrink:0;}
.cyc-wrap{padding:0 14px 14px;}.cyc-label{font-size:12px;color:var(--text-sec);margin-bottom:6px;font-weight:500;}
.cyc-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;}.cyc-fill{height:100%;border-radius:3px;transition:width 0.4s ease;}
.log-section{padding:12px 14px 16px;border-top:1px solid var(--border);}
.log-label{font-size:11px;font-weight:600;color:var(--text-sec);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;}
.sel-date{font-size:15px;font-weight:500;color:var(--text);margin-bottom:14px;min-height:22px;}.sel-date.ph{color:var(--text-sec);font-weight:400;}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn{padding:15px 8px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:transform 0.1s;line-height:1.2;}.btn:active{transform:scale(0.95);}
.btn-pink{background:var(--pink);color:#fff;}.btn-pink-soft{background:var(--pink-light);color:var(--pink);}.btn-purple{background:var(--purple);color:#fff;}.btn-blue{background:var(--blue);color:#fff;}
.phase-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid var(--pink);display:none;}
.phase-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:8px;letter-spacing:0.04em;text-transform:uppercase;}
.phase-name{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px;}.phase-desc{font-size:13px;color:var(--text-sec);line-height:1.55;}
.mode-option{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.mode-option:last-child{border-bottom:none;}.mode-option:active{background:var(--bg);}
.mode-icon{font-size:24px;flex-shrink:0;}.mode-option-title{font-size:14px;font-weight:600;color:var(--text);}.mode-option-sub{font-size:11px;color:var(--text-sec);margin-top:2px;}
.mode-check{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;}
.mode-check.pink{background:var(--pink);border-color:var(--pink);}.mode-check.purple{background:var(--purple);border-color:var(--purple);}.mode-check.blue{background:var(--blue);border-color:var(--blue);}
.date-input-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;display:none;}
.date-input-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px;}.date-input-sub{font-size:12px;color:var(--text-sec);margin-bottom:12px;line-height:1.5;}
.date-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;}
.date-input:focus{border-color:var(--blue);}.date-confirm-btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;}
.date-confirm-btn:active{background:#1565C0;}
.hist-item{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}.hist-item:last-child{border-bottom:none;}
.hist-date{font-size:15px;font-weight:600;color:var(--text);}.hist-sub{font-size:12px;color:var(--text-sec);margin-top:3px;}
.hist-right{display:flex;align-items:center;gap:10px;}
.hist-badge{background:var(--pink-light);color:var(--pink-dark);font-size:13px;font-weight:600;padding:5px 12px;border-radius:20px;}
.del-btn{width:32px;height:32px;border-radius:50%;background:var(--bg);border:none;color:var(--text-sec);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.del-btn:active{background:#ffebee;color:#e53935;}
.empty-state{padding:48px 20px;text-align:center;color:var(--text-sec);}.empty-icon{font-size:44px;margin-bottom:14px;opacity:0.35;}.empty-text{font-size:14px;}
.sett-section{font-size:11px;font-weight:600;color:var(--text-sec);letter-spacing:0.07em;text-transform:uppercase;padding:0 4px 8px;}
.sett-item{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}.sett-item:last-child{border-bottom:none;}
.sett-lbl{font-size:15px;color:var(--text);font-weight:500;}.sett-sub{font-size:12px;color:var(--text-sec);margin-top:2px;}
.sett-ctrl{display:flex;align-items:center;gap:10px;}.sett-num{font-size:18px;font-weight:600;color:var(--pink);min-width:32px;text-align:center;}
.sett-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--pink);background:#fff;font-size:20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;color:var(--pink);font-weight:600;}
.sett-btn:active{background:var(--pink-light);}
.lang-toggle{display:flex;gap:8px;}.lang-toggle-btn{padding:8px 18px;border-radius:10px;border:2px solid var(--border);background:#fff;color:var(--text-sec);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.lang-toggle-btn.active{border-color:var(--pink);background:var(--pink);color:#fff;}
.danger-btn{width:100%;padding:15px;background:#fff;border:1.5px solid #FFCDD2;color:#E53935;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.danger-btn:active{background:#FFF3F3;}.priv-note{margin-top:20px;text-align:center;font-size:12px;color:#bbb;line-height:1.7;}
.neutral-btn{width:100%;padding:15px;background:#fff;border:1.5px solid var(--border);color:var(--text);border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.neutral-btn:active{background:var(--bg);}
.data-btns{display:flex;flex-direction:column;gap:10px;}
.consent-row{display:flex;align-items:flex-start;gap:9px;padding:2px 2px;}
.consent-row input{width:18px;height:18px;flex-shrink:0;margin-top:1px;accent-color:var(--pink);}
.consent-row label{font-size:12px;color:var(--text-sec);line-height:1.5;}
.consent-row label span{color:var(--pink);font-weight:600;cursor:pointer;}
.fertile-detail{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;display:none;}
.fd-title{font-size:11px;font-weight:600;color:var(--text-sec);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;}
.fd-days-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.fd-day{display:flex;flex-direction:column;align-items:center;gap:3px;}
.fd-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;border:1px solid var(--border);color:var(--text-sec);}
.fd-circle.fertile-c{background:#F3E5F5;color:#6A1B9A;border-color:#CE93D8;}
.fd-circle.ovulation-c{background:#9C27B0;color:#fff;border-color:#9C27B0;font-weight:600;}
.fd-circle.today-c{outline:2.5px solid #9C27B0;outline-offset:-2px;}
.fd-day-lbl{font-size:9px;color:#9C27B0;text-align:center;font-weight:500;}
.fd-prob-title{font-size:12px;color:var(--text-sec);margin-bottom:8px;font-weight:500;}
.fd-prob-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.fd-prob-lbl{font-size:11px;color:var(--text-sec);width:72px;flex-shrink:0;}
.fd-prob-bar{flex:1;height:7px;border-radius:4px;background:var(--border);overflow:hidden;}
.fd-prob-fill{height:100%;border-radius:4px;}
.fd-prob-pct{font-size:11px;font-weight:600;width:30px;text-align:right;color:#7B1FA2;flex-shrink:0;}
.conception-tip{border-radius:14px;padding:13px 15px;margin-bottom:12px;border-left:4px solid #9C27B0;display:none;}
.ct-badge{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;}
.ct-text{font-size:13px;line-height:1.6;}
.fertile-dates{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px;display:none;}
.fdate-row{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.fdate-row:last-child{border-bottom:none;}
.fdr-lbl{font-size:13px;color:var(--text-sec);}
.fdr-val{font-size:13px;font-weight:500;color:var(--text);}
.fdr-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.fdb-purple{background:#F3E5F5;color:#6A1B9A;}
.fdb-star{background:#9C27B0;color:#fff;}
.fdb-green{background:#E8F5E9;color:#2E7D32;}
.overlay-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:500;flex-direction:column;}.overlay-screen.active{display:flex;}
.overlay-header{background:var(--pink);padding:16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;flex-shrink:0;}
.overlay-back{background:rgba(255,255,255,0.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.overlay-header-title{font-size:18px;font-weight:600;color:#fff;}
.overlay-body{flex:1;overflow-y:auto;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}.overlay-body::-webkit-scrollbar{display:none;}
.prv-h1{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px;}.prv-h2{font-size:14px;font-weight:600;color:var(--pink);margin:18px 0 6px;}
.prv-p{font-size:13px;color:var(--text-sec);line-height:1.7;margin-bottom:10px;}.prv-updated{font-size:12px;color:#bbb;margin-bottom:20px;}
.about-hero{background:var(--pink);padding:32px 20px 28px;text-align:center;}.about-logo{font-size:52px;margin-bottom:12px;}
.about-appname{font-size:24px;font-weight:600;color:#fff;}.about-version{font-size:13px;color:rgba(255,255,255,0.75);margin-top:4px;}
.about-tagline{font-size:13px;color:rgba(255,255,255,0.85);margin-top:6px;line-height:1.5;}
.about-item{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}.about-item:last-child{border-bottom:none;}
.about-lbl{font-size:14px;color:var(--text);}.about-val{font-size:14px;color:var(--text-sec);}.about-link{font-size:14px;color:var(--pink);cursor:pointer;}
.about-credit{text-align:center;padding:24px 20px;font-size:12px;color:#bbb;line-height:1.8;}
#reset-screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;height:100dvh;background:var(--bg);padding:32px 24px;}
#reset-screen.active{display:flex;}.reset-icon{font-size:48px;margin-bottom:16px;}.reset-title{font-size:22px;font-weight:600;color:var(--text);margin-bottom:8px;}
.reset-sub{font-size:14px;color:var(--text-sec);text-align:center;line-height:1.6;margin-bottom:28px;}.reset-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;}
.reset-back{text-align:center;font-size:14px;color:var(--pink);cursor:pointer;font-weight:500;}
.reset-success{background:#E8F5E9;border:1px solid #A5D6A7;color:#2E7D32;border-radius:12px;padding:12px 14px;font-size:13px;display:none;text-align:center;line-height:1.5;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 0;}.nav-item:active{opacity:0.6;}
.nav-icon{width:26px;height:26px;}.nav-lbl{font-size:10px;color:var(--text-sec);font-weight:500;}.nav-item.active .nav-lbl{color:var(--pink);}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(26,26,26,0.92);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:nowrap;z-index:9999;font-family:inherit;}
.toast.show{opacity:1;}
:focus-visible{outline:2.5px solid var(--pink-dark);outline-offset:2px;}
.disclaimer{font-size:11px;color:var(--text-sec);line-height:1.6;text-align:center;padding:4px 10px 8px;}
a.about-link{text-decoration:none;}
</style>
</head>
<body>
<div id="auth-screen">
  <div class="auth-logo">&#127800;</div>
